name: Build controlled Bloom rewrite v5

on:
  push:
    branches:
      - fix/bloom-rewrite-v4
    paths:
      - experiments/bloom_rewrite/scripts/build_bloom_rewrite_v5.py
      - .bloom_v5_trigger
      - .github/workflows/build_bloom_v5.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/bloom-rewrite-v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build dataset
        run: |
          python experiments/bloom_rewrite/scripts/build_bloom_rewrite_v5.py --overwrite

      - name: Commit generated dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bloom_rewrite_versions/bloom_rewrite_synth_v5
          if git diff --cached --quiet; then
            echo "No dataset changes to commit."
          else
            git commit -m "Generate controlled Bloom rewrite v5 dataset"
            git push origin HEAD:fix/bloom-rewrite-v4
          fi
