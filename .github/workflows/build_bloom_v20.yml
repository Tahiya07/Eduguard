name: Build Bloom rewrite v20

on:
  push:
    branches:
      - fix/bloom-rewrite-v4
    paths:
      - experiments/bloom_rewrite/scripts/build_bloom_rewrite_v20.py
      - .github/workflows/build_bloom_v20.yml

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bloom-rewrite-v4
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build v20
        run: python experiments/bloom_rewrite/scripts/build_bloom_rewrite_v20.py

      - name: Upload combined JSON
        uses: actions/upload-artifact@v4
        with:
          name: bloom-rewrite-synth-v20-json
          path: data/bloom_rewrite_versions/bloom_rewrite_synth_v20/bloom_rewrite_synth_v20.json
          if-no-files-found: error

      - name: Upload split JSONL and reports
        uses: actions/upload-artifact@v4
        with:
          name: bloom-rewrite-synth-v20-package
          path: data/bloom_rewrite_versions/bloom_rewrite_synth_v20/
          if-no-files-found: error

      - name: Commit reproducible dataset package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin fix/bloom-rewrite-v4
          git reset --mixed origin/fix/bloom-rewrite-v4
          git add data/bloom_rewrite_versions/bloom_rewrite_synth_v20
          if git diff --cached --quiet; then
            echo "No dataset changes."
          else
            git commit -m "Generate Bloom rewrite v20 dataset"
            git push origin HEAD:fix/bloom-rewrite-v4
          fi
