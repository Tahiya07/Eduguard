name: Generate Final Multitask Dataset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-multitask-dataset.yml"
      - "experiments/multitask_bloom_rewrite/**"
      - "data/rewrite dataset/bloomshift_final_candidate/**"

permissions:
  contents: read

concurrency:
  group: final-multitask-dataset
  cancel-in-progress: true

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dataset-generation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "datasets==2.20.0" \
            "transformers==4.41.0" \
            "tokenizers==0.19.1" \
            "huggingface_hub<1.0"

      - name: Generate final combined corpus
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
          HF_DATASETS_CACHE: ${{ runner.temp }}/huggingface/datasets
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python experiments/multitask_bloom_rewrite/scripts/prepare_multitask_dataset_final.py \
            --seed 42 \
            --mix-bloom 0.40 \
            --mix-qa 0.30 \
            --mix-sum 0.30

      - name: Validate generated corpus
        env:
          HF_HOME: ${{ runner.temp }}/huggingface
          HF_DATASETS_CACHE: ${{ runner.temp }}/huggingface/datasets
          TOKENIZERS_PARALLELISM: "false"
        run: |
          python experiments/multitask_bloom_rewrite/scripts/validate_multitask_dataset.py \
            --data-dir data/multitask_bloom_rewrite_final \
            --max-length 4096 \
            --model-id Qwen/Qwen2.5-1.5B-Instruct

      - name: Upload generated corpus and reports
        uses: actions/upload-artifact@v4
        with:
          name: eduguard-multitask-dataset-final
          path: |
            data/multitask_bloom_rewrite_final/train.jsonl
            data/multitask_bloom_rewrite_final/validation.jsonl
            data/multitask_bloom_rewrite_final/test.jsonl
            data/multitask_bloom_rewrite_final/dataset_manifest.json
            data/multitask_bloom_rewrite_final/qc_report.json
            experiments/multitask_bloom_rewrite/reports/multitask_final_prepare_report.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
