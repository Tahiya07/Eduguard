name: Build conservative Bloom rewrite v5

on:
  push:
    branches:
      - fix/bloom-rewrite-v4
    paths:
      - experiments/bloom_rewrite/scripts/build_bloom_rewrite_v5_conservative.py
      - .bloom_v5_conservative_trigger.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bloom-rewrite-v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: python experiments/bloom_rewrite/scripts/build_bloom_rewrite_v5_conservative.py --overwrite
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bloom_rewrite_versions/bloom_rewrite_synth_v5
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Generate conservative Bloom rewrite v5 dataset"
            git push origin HEAD:fix/bloom-rewrite-v4
          fi
